name: test

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  required:
    runs-on: ubuntu-latest
    name: ubuntu - ${{ matrix.name }} (${{ matrix.toolchain }})
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            toolchain: stable
            features: ""
          - name: windowed
            toolchain: stable
            features: "--no-default-features --features windowed"
            windowed: true
          - name: all-features
            toolchain: stable
            features: "--all-features"
            windowed: true
          - name: default
            toolchain: beta
            features: ""
    steps:
      - uses: actions/checkout@v4

      - name: clear disk space
        if: ${{ matrix.windowed }}
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: linux dependencies
        if: ${{ matrix.windowed }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwayland-dev libxkbcommon-dev

      - name: install rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test --all-targets
        run: cargo test --locked ${{ matrix.features }} --all-targets

      - name: cargo test --doc
        run: cargo test --locked ${{ matrix.features }} --doc

      # Keep panic=abort artifacts outside `target/` so `rust-cache` does not archive them.
      - name: cargo test --test pty (panic=abort)
        if: ${{ matrix.name == 'default' && matrix.toolchain == 'stable' }}
        env:
          RUSTFLAGS: -Cpanic=abort
          CARGO_TARGET_DIR: ${{ runner.temp }}/pty-abort
        run: cargo test --locked --test pty

  os-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - stable
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: os-check-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check (default)
        run: cargo check --locked --all-targets

      - name: cargo test (all-features)
        run: cargo test --locked --all-features --all-targets

      - name: cargo test --doc (all-features)
        run: cargo test --locked --all-features --doc
