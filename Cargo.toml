[package]
name = "bevy_ratatui"
description = "A Bevy plugin for building terminal user interfaces with Ratatui"
version = "0.14.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ratatui/bevy_ratatui"
documentation = "https://docs.rs/bevy_ratatui"
authors = ["cxreiff <cooper@cxreiff.com>", "Joshka"]
categories = ["command-line-interface"]
keywords = ["cli", "ratatui", "terminal", "tui", "bevy"]
# The example fonts keep their own licenses (see `assets/fonts/`) and are not
# published; `windowed_fonts`, which embeds some, builds from the repository only.
exclude = ["assets/"]

[package.metadata.docs.rs]
features = ["windowed", "scrolling-regions"]

[dependencies]
bevy = { version = "0.20.0", default-features = false }
bitflags = { version = "2.8", optional = true }
ratatui = { version = "0.30", default-features = false }
bevy_terminal_ratatui = { version = "0.12.0", default-features = false, optional = true }

[dev-dependencies]
color-eyre = "0.6"
rand = "0.9"
bevy = { version = "0.20.0", default-features = false, features = [
  "bevy_state",
] }
ratatui = { version = "0.30", default-features = false, features = [
  "underline-color",
  "layout-cache",
  "unstable-widget-ref",
] }

[[example]]
name = "bevy_keys"
path = "examples/bevy_keys.rs"
required-features = ["crossterm", "keyboard"]

[[example]]
name = "demo"
path = "examples/demo.rs"
test = true

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"
required-features = ["crossterm"]

[[example]]
name = "kitty"
path = "examples/kitty.rs"
required-features = ["crossterm"]

[[example]]
name = "layout"
path = "examples/layout.rs"
required-features = ["crossterm"]

[[example]]
name = "layout_test"
path = "examples/layout_test.rs"
required-features = ["crossterm"]

[[example]]
name = "mouse"
path = "examples/mouse.rs"
required-features = ["crossterm", "mouse"]

[[example]]
name = "snake"
path = "examples/snake/main.rs"
test = true
required-features = ["crossterm"]

[[example]]
name = "windowed_fonts"
path = "examples/windowed_fonts.rs"
required-features = ["windowed"]

[[example]]
name = "windowed_mouse"
path = "examples/windowed_mouse.rs"
required-features = ["windowed"]

[[example]]
name = "windowed_system_fonts"
path = "examples/windowed_system_fonts.rs"
required-features = ["windowed", "bevy/system_font_discovery"]

[[test]]
name = "pty"
path = "tests/pty.rs"
harness = false

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Workaround for objc2-foundation crash on macOS 26 (Tahoe).
# See: https://github.com/bevyengine/bevy/issues/19625
[profile.dev.package.objc2]
debug-assertions = false

[features]
default = ["async_executor", "crossterm", "keyboard", "mouse"]
# One backend (`crossterm` or `windowed`) is required. Both enable `bevy/std` so
# Bevy uses its standard-library clock rather than the non-std tick fallback.
crossterm = ["ratatui/crossterm", "bevy/std"]
# The windowed backend renders the Ratatui buffer into a texture on the GPU
# with `bevy_terminal` and displays it in a window, using Bevy's built-in
# default monospace font (ASCII coverage, paired with procedural box-drawing,
# block, shade, and braille sprites; no system font discovery required).
# Applications can supply embedded or dynamically loaded font assets for broader
# Unicode coverage or dedicated bold/italic faces at creation or swap them live.
# It needs a render stack and a window, but none of Bevy's audio, 3D, animation,
# gizmo, picking, scene or gamepad features. Downstream crates that want those
# can enable them on their own `bevy` dependency; Cargo features are additive.
# The platform lines are defaults an application would otherwise have to pick:
# both Linux window protocols, WebGL2 on the web, and multithreading.
windowed = [
  "dep:bevy_terminal_ratatui",
  # platform
  "bevy/std",
  "bevy/multi_threaded",
  "bevy/x11",
  "bevy/wayland",
  "bevy/webgl2",
  # windowing
  "bevy/bevy_window",
  "bevy/bevy_winit",
  # rendering the terminal texture
  "bevy/bevy_render",
  "bevy/bevy_core_pipeline",
  "bevy/bevy_asset",
  "bevy/bevy_image",
  "bevy/bevy_text",
  "bevy/default_font",
  # `ImageNode` / `Node` used to present the texture
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
]
keyboard = ["bevy/keyboard", "dep:bitflags"]
mouse = ["bevy/mouse"]
# Ratatui's extended backend trait, whose scroll methods every backend in the
# build must then implement: enabling `ratatui/scrolling-regions` directly would
# leave the windowed backend without them.
scrolling-regions = [
  "ratatui/scrolling-regions",
  "bevy_terminal_ratatui?/scrolling-regions",
]
async_executor = ["bevy/async_executor"]
