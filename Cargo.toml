[package]
name = "bevy_ratatui"
description = "A Bevy plugin for building terminal user interfaces with Ratatui"
version = "0.11.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ratatui/bevy_ratatui"
documentation = "https://docs.rs/bevy_ratatui"
authors = ["cxreiff <cooper@cxreiff.com>", "Joshka"]
categories = ["command-line-interface"]
keywords = ["cli", "ratatui", "terminal", "tui", "bevy"]

[dependencies]
bevy = { version = "0.19", default-features = false }
bitflags = "2.8"
ratatui = { version = "0.30", default-features = false }
soft_ratatui = { version = "0.1", optional = true }
tracing = "0.1"

[dev-dependencies]
color-eyre = "0.6"
rand = "0.9"
bevy = { version = "0.19", default-features = false, features = [
  "bevy_state",
] }
ratatui = { version = "0.30", default-features = false, features = [
  "underline-color",
  "layout-cache",
  "unstable-widget-ref",
] }

[[example]]
name = "demo"
path = "examples/demo.rs"
test = true

[[example]]
name = "snake"
path = "examples/snake/main.rs"
test = true

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Workaround for objc2-foundation crash on macOS 26 (Tahoe).
# See: https://github.com/bevyengine/bevy/issues/19625
[profile.dev.package.objc2]
debug-assertions = false

[features]
default = ["std", "async_executor", "crossterm", "keyboard", "mouse"]
crossterm = ["ratatui/crossterm"]
# The windowed backend software-renders the Ratatui buffer into a texture and
# displays it in a window. It needs a render stack and a window, but none of
# Bevy's audio, 3D, animation, gizmo, picking, scene or gamepad features.
# Downstream crates that want those can enable them on their own `bevy`
# dependency; Cargo features are additive.
windowed = [
  "dep:soft_ratatui",
  # platform
  "bevy/std",
  "bevy/multi_threaded",
  "bevy/x11",
  "bevy/wayland",
  "bevy/webgl2",
  # windowing
  "bevy/bevy_window",
  "bevy/bevy_winit",
  # rendering the terminal texture
  "bevy/bevy_render",
  "bevy/bevy_core_pipeline",
  "bevy/bevy_asset",
  "bevy/bevy_image",
  # `ImageNode` / `Node` used to present the texture
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
]
keyboard = ["bevy/keyboard"]
mouse = ["bevy/mouse"]

# Features for `std` platforms
std = ["bevy/std"]
async_executor = ["bevy/async_executor"]

# Features for `no_std` platforms
libm = ["bevy/libm"]
critical-section = ["bevy/critical-section"]
